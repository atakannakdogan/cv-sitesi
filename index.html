<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="google-site-verification" content="OoDVFkyw7jCteLxAFfsIFzD3itqzyFejX9G9eiIZbgg" />
    <title>Ücretsiz CV Oluşturucu - Hızlı ve Şık Özgeçmiş Hazırla</title>
<meta name="description" content="Saniyeler içinde profesyonel ve şık bir CV oluşturun. Tamamen ücretsiz, üyeliksiz ve anında PDF olarak indirin.">
<meta name="keywords" content="cv oluştur, özgeçmiş hazırla, ücretsiz cv, pdf cv indir, cv şablonu">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel CV Oluşturucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* A4 Boyutu ve Önizleme Alanı İçin Stil */
        .a4-preview {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin: 0 auto;
            padding: 20mm; /* A4 standart kenar boşluğu */
            box-sizing: border-box;
            transform-origin: top center;
        }

        /* Yazdırma (PDF Kaydetme) Stilleri */
        @media print {
            body {
                background-color: white;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                width: 100% !important;
                height: 100% !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 10mm !important; /* Yazdırma kenar boşluğu */
                transform: none !important;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }

        /* Kaydırma Çubuğu Stilleri */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- SOL PANEL: Form Alanı -->
    <div class="w-full md:w-1/3 h-full bg-white border-r border-gray-200 flex flex-col no-print z-10 shadow-lg relative">
        <div class="p-6 border-b border-gray-200 bg-gray-50 flex justify-between items-center sticky top-0 z-20">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">CV Oluşturucu</h1>
                <p class="text-sm text-gray-500 mt-1">Bilgilerinizi girin, CV'niz anında hazır.</p>
            </div>
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                PDF İndir
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-8" id="form-container">
            
            <!-- Kişisel Bilgiler -->
            <section>
                <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center border-b pb-2">
                    <span class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 inline-flex items-center justify-center mr-2 text-sm">1</span>
                    Kişisel Bilgiler
                </h2>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ad</label>
                            <input type="text" id="f-name" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" oninput="updateCV()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Soyad</label>
                            <input type="text" id="f-surname" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition" oninput="updateCV()">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Meslek / Unvan</label>
                        <input type="text" id="f-title" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition" oninput="updateCV()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hakkımda / Özet</label>
                        <textarea id="f-summary" rows="3" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition" oninput="updateCV()"></textarea>
                    </div>
                </div>
            </section>

            <!-- İletişim Bilgileri -->
            <section>
                <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center border-b pb-2">
                    <span class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 inline-flex items-center justify-center mr-2 text-sm">2</span>
                    İletişim
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">E-posta</label>
                        <input type="email" id="f-email" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition" oninput="updateCV()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Telefon</label>
                        <input type="text" id="f-phone" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition" oninput="updateCV()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Konum (Şehir, Ülke)</label>
                        <input type="text" id="f-location" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition" oninput="updateCV()">
                    </div>
                </div>
            </section>

            <!-- Deneyim -->
            <section>
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-gray-700 flex items-center">
                        <span class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 inline-flex items-center justify-center mr-2 text-sm">3</span>
                        İş Deneyimi
                    </h2>
                    <button onclick="addExperience()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">+ Ekle</button>
                </div>
                <div id="experience-list" class="space-y-4">
                    <!-- Dinamik olarak doldurulacak -->
                </div>
            </section>

            <!-- Eğitim -->
            <section>
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-gray-700 flex items-center">
                        <span class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 inline-flex items-center justify-center mr-2 text-sm">4</span>
                        Eğitim
                    </h2>
                    <button onclick="addEducation()" class="text-sm text-blue-600 hover:text-blue-800 font-medium">+ Ekle</button>
                </div>
                <div id="education-list" class="space-y-4">
                    <!-- Dinamik olarak doldurulacak -->
                </div>
            </section>

            <!-- Yetenekler -->
            <section>
                <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center border-b pb-2">
                    <span class="bg-blue-100 text-blue-600 rounded-full w-6 h-6 inline-flex items-center justify-center mr-2 text-sm">5</span>
                    Yetenekler
                </h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Virgülle ayırarak yazın</label>
                    <textarea id="f-skills" rows="2" class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition" oninput="updateCV()" placeholder="Örn: JavaScript, React, İletişim, Liderlik"></textarea>
                </div>
            </section>

        </div>
    </div>

    <!-- SAĞ PANEL: Canlı Önizleme -->
    <div class="w-full md:w-2/3 h-full overflow-y-auto bg-gray-200 p-4 md:p-8 flex justify-center preview-container">
        <!-- A4 Sayfası -->
        <div id="cv-preview" class="a4-preview print-area flex flex-col text-gray-800">
            <!-- CV İçeriği Dinamik Olarak Buraya Basılacak -->
        </div>
    </div>

    <script>
        // --- BAŞLANGIÇ VERİLERİ (Örnek Veriler) ---
        let cvData = {
            personal: {
                name: "Ahmet",
                surname: "Yılmaz",
                title: "Kıdemli Yazılım Mühendisi",
                summary: "Modern web teknolojileri ve kullanıcı deneyimi odaklı arayüzler geliştirme konusunda 5+ yıl deneyime sahip yazılım mühendisi. Ekip çalışmasına yatkın, problem çözme odaklı ve sürekli öğrenmeye hevesli.",
                email: "ahmet.yilmaz@ornek.com",
                phone: "+90 555 123 45 67",
                location: "İstanbul, Türkiye"
            },
            experience: [
                { id: 1, company: "Tech Solutions A.Ş.", role: "Frontend Geliştirici", date: "2020 - Devam Ediyor", desc: "React ve TailwindCSS kullanarak büyük ölçekli kurumsal web uygulamaları geliştirdim. Sayfa yüklenme hızlarını %40 artırdım." },
                { id: 2, company: "Dijital Ajans", role: "Web Geliştirici", date: "2018 - 2020", desc: "Çeşitli müşteriler için duyarlı (responsive) web siteleri tasarlayıp kodladım. WordPress ve özel CMS sistemleri yönettim." }
            ],
            education: [
                { id: 1, school: "Boğaziçi Üniversitesi", degree: "Bilgisayar Mühendisliği (Lisans)", date: "2014 - 2018" }
            ],
            skills: "JavaScript, HTML5/CSS3, React, Node.js, Git, UI/UX Tasarım, Çevik Metodolojiler"
        };

        // --- FORM DOLDURMA İŞLEMLERİ ---
        function initForm() {
            document.getElementById('f-name').value = cvData.personal.name;
            document.getElementById('f-surname').value = cvData.personal.surname;
            document.getElementById('f-title').value = cvData.personal.title;
            document.getElementById('f-summary').value = cvData.personal.summary;
            document.getElementById('f-email').value = cvData.personal.email;
            document.getElementById('f-phone').value = cvData.personal.phone;
            document.getElementById('f-location').value = cvData.personal.location;
            document.getElementById('f-skills').value = cvData.skills;

            renderExperienceForm();
            renderEducationForm();
            updateCV();
        }

        // --- DİNAMİK ALAN YÖNETİMİ (Deneyim & Eğitim) ---
        function renderExperienceForm() {
            const list = document.getElementById('experience-list');
            list.innerHTML = '';
            cvData.experience.forEach((exp, index) => {
                const item = document.createElement('div');
                item.className = 'p-4 bg-gray-50 border border-gray-200 rounded-md relative group';
                item.innerHTML = `
                    <button onclick="removeExperience(${index})" class="absolute top-2 right-2 text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition" title="Sil">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                    <input type="text" placeholder="Şirket Adı" value="${exp.company}" class="w-full mb-2 border border-gray-300 rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" oninput="updateExperience(${index}, 'company', this.value)">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="text" placeholder="Pozisyon" value="${exp.role}" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" oninput="updateExperience(${index}, 'role', this.value)">
                        <input type="text" placeholder="Tarih (Örn: 2020-2023)" value="${exp.date}" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" oninput="updateExperience(${index}, 'date', this.value)">
                    </div>
                    <textarea placeholder="Açıklama" rows="2" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" oninput="updateExperience(${index}, 'desc', this.value)">${exp.desc}</textarea>
                `;
                list.appendChild(item);
            });
        }

        function renderEducationForm() {
            const list = document.getElementById('education-list');
            list.innerHTML = '';
            cvData.education.forEach((edu, index) => {
                const item = document.createElement('div');
                item.className = 'p-4 bg-gray-50 border border-gray-200 rounded-md relative group';
                item.innerHTML = `
                    <button onclick="removeEducation(${index})" class="absolute top-2 right-2 text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition" title="Sil">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                    <input type="text" placeholder="Okul Adı" value="${edu.school}" class="w-full mb-2 border border-gray-300 rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" oninput="updateEducation(${index}, 'school', this.value)">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" placeholder="Bölüm / Derece" value="${edu.degree}" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" oninput="updateEducation(${index}, 'degree', this.value)">
                        <input type="text" placeholder="Tarih" value="${edu.date}" class="w-full border border-gray-300 rounded p-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" oninput="updateEducation(${index}, 'date', this.value)">
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // --- GÜNCELLEME FONKSİYONLARI ---
        function updateExperience(index, key, value) {
            cvData.experience[index][key] = value;
            updateCV();
        }

        function updateEducation(index, key, value) {
            cvData.education[index][key] = value;
            updateCV();
        }

        function addExperience() {
            cvData.experience.push({ id: Date.now(), company: "", role: "", date: "", desc: "" });
            renderExperienceForm();
            updateCV();
            document.getElementById('form-container').scrollTo(0, document.getElementById('form-container').scrollHeight);
        }

        function removeExperience(index) {
            cvData.experience.splice(index, 1);
            renderExperienceForm();
            updateCV();
        }

        function addEducation() {
            cvData.education.push({ id: Date.now(), school: "", degree: "", date: "" });
            renderEducationForm();
            updateCV();
            document.getElementById('form-container').scrollTo(0, document.getElementById('form-container').scrollHeight);
        }

        function removeEducation(index) {
            cvData.education.splice(index, 1);
            renderEducationForm();
            updateCV();
        }

        // --- CV GÖRSELİNİ (ÖNİZLEME) GÜNCELLEME ---
        function updateCV() {
            // Formdaki basit değerleri oku
            cvData.personal.name = document.getElementById('f-name').value;
            cvData.personal.surname = document.getElementById('f-surname').value;
            cvData.personal.title = document.getElementById('f-title').value;
            cvData.personal.summary = document.getElementById('f-summary').value;
            cvData.personal.email = document.getElementById('f-email').value;
            cvData.personal.phone = document.getElementById('f-phone').value;
            cvData.personal.location = document.getElementById('f-location').value;
            cvData.skills = document.getElementById('f-skills').value;

            const preview = document.getElementById('cv-preview');
            
            // Yetenekleri diziye çevir
            const skillsArray = cvData.skills.split(',').map(s => s.trim()).filter(s => s !== "");

            // HTML İçeriğini Oluştur
            let html = `
                <!-- Üst Kısım: Başlık ve İletişim -->
                <div class="border-b-2 border-gray-800 pb-6 mb-6">
                    <h1 class="text-4xl font-bold uppercase tracking-wide text-gray-900">${cvData.personal.name} <span class="font-light">${cvData.personal.surname}</span></h1>
                    <p class="text-xl text-blue-600 mt-1 font-medium">${cvData.personal.title}</p>
                    
                    <div class="flex flex-wrap gap-4 mt-4 text-sm text-gray-600">
                        ${cvData.personal.email ? `<div class="flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            ${cvData.personal.email}
                        </div>` : ''}
                        
                        ${cvData.personal.phone ? `<div class="flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            ${cvData.personal.phone}
                        </div>` : ''}
                        
                        ${cvData.personal.location ? `<div class="flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            ${cvData.personal.location}
                        </div>` : ''}
                    </div>
                </div>

                <!-- Özet Alanı -->
                ${cvData.personal.summary ? `
                <div class="mb-6">
                    <h2 class="text-lg font-bold text-gray-800 uppercase tracking-wider mb-2">Hakkımda</h2>
                    <p class="text-sm text-gray-700 leading-relaxed text-justify">${cvData.personal.summary}</p>
                </div>
                ` : ''}

                <!-- Alt Kısım: Deneyim, Eğitim (İki Kolonlu Yapı) -->
                <div class="flex flex-col gap-6">
                    
                    <!-- Sol Kolon / Ana Kısım: Deneyim -->
                    <div class="flex-1">
                        ${cvData.experience.length > 0 ? `
                        <h2 class="text-lg font-bold text-gray-800 uppercase tracking-wider mb-4 border-b pb-1">İş Deneyimi</h2>
                        <div class="space-y-5">
                            ${cvData.experience.map(exp => `
                            <div>
                                <div class="flex justify-between items-baseline mb-1">
                                    <h3 class="text-base font-bold text-gray-900">${exp.role}</h3>
                                    <span class="text-sm font-semibold text-blue-600">${exp.date}</span>
                                </div>
                                <h4 class="text-sm font-semibold text-gray-600 mb-1">${exp.company}</h4>
                                <p class="text-sm text-gray-700 leading-relaxed">${exp.desc}</p>
                            </div>
                            `).join('')}
                        </div>
                        ` : ''}

                        <!-- Eğitim -->
                        ${cvData.education.length > 0 ? `
                        <h2 class="text-lg font-bold text-gray-800 uppercase tracking-wider mt-6 mb-4 border-b pb-1">Eğitim</h2>
                        <div class="space-y-4">
                            ${cvData.education.map(edu => `
                            <div>
                                <div class="flex justify-between items-baseline mb-1">
                                    <h3 class="text-base font-bold text-gray-900">${edu.school}</h3>
                                    <span class="text-sm font-semibold text-blue-600">${edu.date}</span>
                                </div>
                                <p class="text-sm text-gray-700">${edu.degree}</p>
                            </div>
                            `).join('')}
                        </div>
                        ` : ''}

                        <!-- Yetenekler -->
                        ${skillsArray.length > 0 ? `
                        <h2 class="text-lg font-bold text-gray-800 uppercase tracking-wider mt-6 mb-4 border-b pb-1">Yetenekler</h2>
                        <div class="flex flex-wrap gap-2 mt-2">
                            ${skillsArray.map(skill => `
                                <span class="bg-gray-100 text-gray-800 px-3 py-1 rounded-sm text-sm font-medium border border-gray-200">${skill}</span>
                            `).join('')}
                        </div>
                        ` : ''}

                    </div>
                </div>
            `;

            preview.innerHTML = html;
        }

        // Sayfa yüklendiğinde başlat
        window.onload = () => {
            initForm();
            
            // Eğer ekran çok küçükse ve mobildeysek formu açılışta göstermek için scroll ayarı (opsiyonel)
            // Mobilde üstte form altta önizleme mantıklı. 
        };
    </script>
</body>
</html>
